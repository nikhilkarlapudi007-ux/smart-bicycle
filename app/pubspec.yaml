name: bike_app
description: "Smart Bicycle companion app: BLE telemetry, GPS map, tamper alerts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.0
  location: ^5.0.0
  provider: ^6.0.5
  flutter_blue_classic: ^0.0.7
  permission_handler: ^11.2.0
  latlong2: ^0.9.0
  flutter_map: ^6.0.0
  syncfusion_flutter_gauges: ^24.1.41
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
